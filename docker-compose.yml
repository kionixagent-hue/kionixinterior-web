services:
  web:
    build:
      context: .
      target: deps
    image: kionix-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    command: npm run dev
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=kionix
      - POSTGRES_PASSWORD=kionix
      - POSTGRES_DB=kionix
    volumes:
      - kionix_postgres_data:/var/lib/postgresql/data

volumes:
  kionix_postgres_data:
